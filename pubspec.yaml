name: drive_metrics_ai
description: AI-powered smart vehicle black box mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management
  flutter_riverpod: ^2.5.1

  # State management (already in your project)
  provider:
    ^6.1.1

    # Local DB
  sqflite: ^2.3.2
  path: ^1.9.0

  # PDF + sharing
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2

  # Map (for route display)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # BLE
  flutter_blue_plus: ^1.31.0

  # Charts
  fl_chart: ^0.68.0

  # HTTP
  dio: ^5.4.3

  # Local storage
  shared_preferences: ^2.2.3

  # Utilities
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
