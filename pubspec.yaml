name: drive_metrics_ai
description: AI-powered smart vehicle black box mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Charts
  fl_chart: ^0.68.0

  # HTTP
  dio: ^5.4.3

  pdf: ^3.11.0
  printing: ^5.13.0

  # Local storage
  shared_preferences: ^2.2.3

  # Utilities
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
